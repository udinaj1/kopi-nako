<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopi Nako Solo - Full Browser Integrated System</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1E1E1E;
            --text-color: #FFFFFF;
            --accent-color: #2E5A44; /* Forest Green dari Prompt Figma */
            --accent-light: #3D7A5D;
            --text-muted: #8A8A8A;
            --danger-color: #FF453A;
            --gold-color: #D4AF37;
            --neon-green: #00E676;
            --border-color: #2A2A2A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* TOP NAVIGATION BAR - FULL WIDTH */
        header {
            background-color: var(--surface-color);
            padding: 16px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
        header span { color: var(--neon-green); font-weight: bold; font-size: 12px; }

        /* MULTI-ROLE TAB SWITCHER */
        .role-switcher {
            display: flex;
            gap: 8px;
            background: #121212;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .role-btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .role-btn.active {
            background: var(--accent-color);
            color: white;
        }

        /* MAIN CONTENT AREA - FULL SCREEN EXPANDED */
        .main-container {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .card {
            background-color: var(--surface-color);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        /* UTILITY BUTTONS */
        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            transition: background 0.2s;
        }
        .btn-primary:hover { background-color: var(--accent-light); }

        .badge-gold {
            background: rgba(212, 175, 55, 0.12);
            color: var(--gold-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            border: 1px solid rgba(212, 175, 55, 0.25);
            margin-bottom: 15px;
        }

        /* SCREEN 1: FULL HERO BANNER */
        .hero-banner {
            width: 100%;
            height: 300px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.9)), url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            border-radius: 18px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        /* SCREEN 2: FLOOR PLAN GRID */
        .grid-tables {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .card-table {
            background-color: var(--bg-color);
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .card-table.available { border-color: var(--neon-green); }
        .card-table.available:hover { background-color: #142F22; }
        .card-table.selected-active { background-color: #142F22 !important; border-color: var(--neon-green) !important; }
        .card-table.occupied { opacity: 0.4; cursor: not-allowed; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }

        /* SCREEN 3: MENU ITEMS */
        .search-bar {
            background-color: var(--bg-color);
            padding: 16px;
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            width: 100%;
        }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .menu-item-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg-dark); padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); }
        .btn-plus { background: var(--accent-color); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* SCREEN 4: TIMELINE STEPPER */
        .stepper-timeline { margin-top: 20px; border-left: 2px solid var(--border-color); padding-left: 20px; position: relative; }
        .stepper-item { position: relative; margin-bottom: 24px; }
        .step-circle { width: 14px; height: 14px; background-color: #333; border-radius: 50%; position: absolute; left: -28px; top: 4px; display: flex; align-items: center; justify-content: center; font-size: 8px; }
        .stepper-item.checked .step-circle { background-color: var(--neon-green); color: black; font-weight: bold; }

        /* SCREEN 5: METRICS & CHART */
        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 20px; }
        .chart-container { display: flex; justify-content: space-between; align-items: flex-end; height: 140px; margin-top: 20px; padding-bottom: 5px; border-bottom: 1px solid var(--border-color); }
        .bar { width: 30px; background-color: #2A2A2A; border-radius: 6px 6px 0 0; }
        .bar.peak { background-color: var(--accent-light); }
        .alert-card { background: var(--bg-color); padding: 14px; border-radius: 12px; border-left: 4px solid var(--gold-color); font-size: 13px; margin-top: 10px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- SYSTEM GLOBAL HEADER -->
    <header>
        <div>
            <h1>Kopi Nako Solo</h1>
            <span>UTS UI/UX Ecosystem Framework • Full Layout Mode</span>
        </div>
        <div class="role-switcher">
            <button class="role-btn active" id="tab-cust" onclick="switchMainRole('customer')">🧑‍💻 Dasbor Pengguna</button>
            <button class="role-btn" id="tab-staff" onclick="switchMainRole('staff')">📋 Dasbor Staf & Owner</button>
        </div>
    </header>

    <main class="main-container">

        <!-- ================= HALAMAN UTAMA: DASBOR PENGGUNA (CUSTOMER PLATFORM) ================= -->
        <div id="view-customer-platform">
            
            <!-- SCREEN 1: PREMIUM HOME SCREEN -->
            <div id="screen-home" class="card">
                <p style="color: var(--text-muted); font-size: 12px; font-weight: 700; letter-spacing: 0.5px;">KOPI NAKO / SOLO</p>
                <h2 style="margin-top: 4px; font-size: 28px;">Halo, Budi</h2>
                <div class="badge-gold">✨ Nako Club Gold: 1.200 XP</div>
                
                <div class="hero-banner">
                    <span style="background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 20px; font-size: 11px; align-self: flex-start; margin-bottom: auto; font-weight: 600;">● Buka hingga 23.00</span>
                    <p style="color: var(--text-muted); font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;">RUANG UNTUK JEDA</p>
                    <h3 style="font-size: 26px; font-weight: 800; margin: 6px 0; line-height: 1.3;">Kopi yang baik.<br>Ruang yang berarti.</h3>
                    <p style="font-size: 13px; color: #D1D1D6;">Temukan sudut favoritmu di Nako Solo.</p>
                </div>

                <!-- TOMBOL IJO SEKARANG BISA DITEKAN SECARA LIVE -->
                <button class="btn-primary" onclick="switchToSubScreen('screen-table')">
                    <span>Pesan Tanpa Antre & Cek Meja</span>
                    <span style="font-size: 18px;">→</span>
                </button>
            </div>

            <!-- SCREEN 2: INTERACTIVE LIVE TABLE FLOOR PLAN -->
            <div id="screen-table" class="card hidden">
                <h2>Peta Meja Real-time</h2>
                <p style="color: var(--neon-green); font-size: 14px; font-weight: 600; margin-bottom: 16px;">🟢 3 dari 6 meja tersedia</p>
                
                <div style="display: flex; gap: 16px; font-size: 12px; color: var(--text-muted); background: var(--bg-color); padding: 12px; border-radius: 10px; margin-bottom: 20px; width: max-content; border: 1px solid var(--border-color);">
