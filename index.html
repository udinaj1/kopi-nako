<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopi Nako Solo - Premium Integrated Dashboard System</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1E1E1E;
            --text-color: #FFFFFF;
            --accent-color: #2E5A44; /* Forest Green dari Prompt Figma */
            --accent-light: #3D7A5D;
            --text-muted: #8A8A8A;
            --danger-color: #FF453A;
            --gold-color: #D4AF37;
            --neon-green: #00E676;
            --border-color: #2A2A2A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* TOP GLOBAL NAVIGATION NAVIGATION BAR (FULL WIDTH) */
        .global-header {
            background-color: var(--surface-color);
            padding: 16px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo-section h1 { font-size: 22px; font-weight: 800; color: var(--text-color); letter-spacing: 0.5px; }
        .logo-section span { font-size: 12px; color: var(--neon-green); font-weight: bold; }

        .dashboard-switcher {
            display: flex;
            gap: 12px;
            background: #121212;
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .switch-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .switch-btn.active {
            background: var(--accent-color);
            color: white;
            box-shadow: 0 4px 12px rgba(46, 90, 68, 0.3);
        }

        /* MAIN CONTENT AREA - FULL EXPANDED VIEW */
        .main-viewport {
            flex: 1;
            padding: 30px;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
        }

        /* REUSABLE UI CARD & BUTTON */
        .card {
            background-color: var(--surface-color);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .btn:hover { background-color: var(--accent-light); }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }
        .badge-gold { background: rgba(212, 175, 55, 0.12); color: var(--gold-color); border: 1px solid rgba(212, 175, 55, 0.25); }
        .badge-wait { background: rgba(212, 175, 55, 0.15); color: var(--gold-color); }
        .badge-brew { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .badge-done { background: rgba(0, 230, 118, 0.15); color: var(--neon-green); }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }

        /* ================= GRID 1: LAYAR DASBOR PENGGUNA (CUSTOMER PLATFORM) ================= */
        .customer-layout-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 30px;
            width: 100%;
        }

        /* Banner Utama */
        .hero-banner {
            width: 100%;
            height: 250px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.9)), url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border: 1px solid var(--border-color);
        }

        /* Peta Meja Grid */
        .grid-tables-floor { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 16px; }
        .card-table-floor { background-color: #121212; border: 1.5px solid var(--border-color); border-radius: 14px; padding: 16px; cursor: pointer; transition: all 0.2s; }
        .card-table-floor.available { border-color: var(--neon-green); }
        .card-table-floor.selected-active { background-color: #142F22 !important; border-color: var(--neon-green) !important; }
        .card-table-floor.occupied { opacity: 0.4; cursor: not-allowed; }

        /* Menu list row layout */
        .menu-item-row { display: flex; justify-content: space-between; align-items: center; background: #121212; padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 12px; }
        .btn-plus-circular { background: var(--accent-color); color: white; border: none; width: 32px; height: 32px; border-radius: 50%; font-weight: bold; cursor: pointer; font-size: 16px; }

        /* ================= GRID 2: LAYAR DASBOR STAF & OWNER (STAFF PLATFORM) ================= */
        .staff-layout-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            width: 100%;
        }

        /* Tracker Timeline Stepper */
        .stepper-timeline { margin-top: 15px; border-left: 2px solid var(--border-color); padding-left: 20px; position: relative; }
        .stepper-item { position: relative; margin-bottom: 24px; }
        .step-circle { width: 14px; height: 14px; background-color: #333; border-radius: 50%; position: absolute; left: -28px; top: 4px; display: flex; align-items: center; justify-content: center; font-size: 8px; }
        .stepper-item.checked .step-circle { background-color: var(--neon-green); color: black; font-weight: bold; }

        /* Analytics Visual components */
        .metrics-subgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .chart-wrapper { display: flex; justify-content: space-between; align-items: flex-end; height: 110px; margin-top: 20px; padding: 0 4px; border-bottom: 1px solid var(--border-color); }
        .bar-col { width: 22px; background-color: #2A2A2A; border-radius: 4px 4px 0 0; }
        .bar-col.peak-active { background-color: var(--accent-light); }
        .alert-item-log { background: #121212; padding: 12px; border-radius: 10px; border-left: 4px solid var(--gold-color); font-size: 12px; margin-top: 10px; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- TOP CONTROL NAVIGATION HEADER (FULL WINDOW) -->
    <header class="global-header">
        <div class="logo-section">
            <h1>Kopi Nako Solo</h1>
            <span>Ecosystem Prototype Framework v3.0 • Full Browser View</span>
        </div>
        
        <!-- Live Dashboard Switch Links -->
        <div class="dashboard-switcher">
            <button class="switch-btn active" id="btn-view-customer" onclick="togglePlatformView('customer')">🧑‍💻 1. Dasbor Pengguna (Customer)</button>
            <button class="switch-btn" id="btn-view-staff" onclick="togglePlatformView('staff')">💼 2. Dasbor Staf & Manajemen (Staff/Owner)</button>
        </div>
    </header>

    <main class="main-viewport">

        <!-- ================= PLATFORM VIEW 1: DASBOR LAYAR PENGGUNA (FULL WINDOW) ================= -->
        <div id="platform-customer" class="customer-layout-grid">
            
            <!-- Kolom Kiri: Profil, Banner, & Lantai Meja -->
            <div>
                <div class="card">
                    <p class="nav-icon" style="font-size:12px; color:var(--text-muted); font-weight:700; letter-spacing:1px; text-transform:uppercase;">SCREEN 1: WELCOME PROFILE</p>
                    <h2 style="margin-top: 6px;">Halo, Budi</h2>
                    <div class="badge badge-gold" style="margin-top: 6px;">✨ Nako Club Gold: 1.200 XP</div>
                    
                    <div class="hero-banner">
                        <span style="background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 20px; font-size: 11px; align-self: flex-start; margin-bottom: auto; font-weight: 600;">● Buka hingga 23.00</span>
                        <h3 style="font-size: 20px; font-weight: 800; margin: 4px 0; line-height: 1.3;">Kopi yang baik.<br>Ruang yang berarti.</h3>
                        <p style="font-size: 12px; color: #D1D1D6;">Temukan sudut favoritmu di Nako Solo.</p>
                    </div>
                </div>

                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3>SCREEN 2: Peta Meja Real-time</h3>
                        <span class="badge badge-done">🟢 3 dari 6 Tersedia</span>
                    </div>
