<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopi Nako Solo - 5 Screen Mobile Ecosystem</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1E1E1E;
            --text-color: #FFFFFF;
            --accent-color: #2E5A44; /* Forest Green */
            --accent-light: #3D7A5D;
            --text-muted: #8A8A8A;
            --danger-color: #FF453A;
            --gold-color: #D4AF37;
            --neon-green: #00E676;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #222222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        /* Smartphone Frame Format Mockup (Consistent across all devices) */
        .phone-container {
            width: 390px;
            height: 844px;
            background-color: var(--bg-color);
            border: 12px solid #333333;
            border-radius: 44px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* Top System Status Bar */
        .status-bar {
            height: 44px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            background: transparent;
            z-index: 10;
        }

        /* Main Content Viewport */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            padding-bottom: 95px;
        }
        .app-content::-webkit-scrollbar { display: none; }

        h2 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .sub-tag { color: var(--text-muted); font-size: 11px; letter-spacing: 1px; font-weight: 600; text-transform: uppercase; }

        /* Shared UI Elements */
        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .btn-primary:hover { background-color: var(--accent-light); }

        .card {
            background-color: var(--surface-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid #2A2A2A;
        }

        /* SCREEN 1: HOME ELEMENTS */
        .badge-gold {
            background: rgba(212, 175, 55, 0.12);
            color: var(--gold-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            margin-top: 6px;
        }

        .hero-banner {
            width: 100%;
            height: 200px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.85)), url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin: 20px 0;
        }

        /* SCREEN 2: FLOOR PLAN ELEMENT */
        .grid-tables {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-top: 16px;
        }
        .card-table {
            background-color: var(--surface-color);
            border: 1.5px solid #2A2A2A;
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            position: relative;
        }
        .card-table.available { border-color: var(--neon-green); box-shadow: 0 0 8px rgba(0, 230, 118, 0.15); }
        .card-table.occupied { opacity: 0.5; }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }

        /* SCREEN 3: MENU ELEMENT */
        .search-bar {
            background-color: var(--surface-color);
            padding: 14px;
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 16px;
            border: 1px solid #2A2A2A;
        }
        .tab-bar-slider { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; }
        .tab-bar-slider::-webkit-scrollbar { display: none; }
        .tab { padding: 8px 16px; border-radius: 20px; background-color: var(--surface-color); font-size: 13px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
        .tab.active { background-color: var(--accent-color); color: white; }
        
        .menu-item {
            background-color: var(--surface-color);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border: 1px solid #2A2A2A;
        }
        .circular-plus { background-color: var(--accent-color); color: white; border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 20px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; }

        /* SCREEN 4: STEPPER TIMELINE */
        .stepper-timeline { margin-top: 20px; border-left: 2px solid #2A2A2A; padding-left: 20px; position: relative; }
        .stepper-item { position: relative; margin-bottom: 24px; }
        .step-circle { width: 14px; height: 14px; background-color: #333333; border-radius: 50%; position: absolute; left: -28px; top: 4px; display: flex; align-items: center; justify-content: center; font-size: 8px; }
        .stepper-item.checked .step-circle { background-color: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); color: black; }

        /* SCREEN 5: EXECUTIVE DASHBOARD */
        .metrics-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .chart-wrapper { display: flex; justify-content: space-between; align-items: flex-end; height: 120px; margin-top: 16px; padding: 0 4px; }
        .bar { width: 20px; background-color: #2A2A2A; border-radius: 4px 4px 0 0; }
        .bar.peak { background-color: var(--accent-light); }
        .alert-card { background-color: var(--surface-color); padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; border-left: 4px solid var(--gold-color); font-size: 12px; margin-bottom: 8px;}

        /* Bottom Nav Frame Bar */
        .bottom-nav-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background-color: #1A1A1A;
            border-top: 1px solid #2A2A2A;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 14px;
            z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--text-muted); cursor: pointer; font-weight: 500; }
        .nav-item.active { color: var(--text-color); }
        .nav-icon { font-size: 22px; margin-bottom: 3px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="status-bar">
        <div>9:41</div>
        <div>📶 🔋</div>
    </div>

    <!-- SCREEN 1: CUSTOMER PREMIUM HOME -->
    <div id="screen-home" class="app-content">
        <p class="sub-tag">KOPI NAKO / SOLO</p>
        <h2 style="margin-top: 2px;">Halo, Budi</h2>
        <div class="badge-gold">✨ <span id="lbl-xp">Nako Club Gold: 1.200 XP</span></div>
        
        <div class="hero-banner">
            <span style="background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 20px; font-size: 11px; align-self: flex-start; margin-bottom: auto; font-weight: 600;">● Buka hingga 23.00</span>
            <p class="sub-tag" style="color: var(--text-muted);">RUANG UNTUK JEDA</p>
            <h3 style="font-size: 22px; font-weight: 800; margin: 4px 0; line-height: 1.2;">Kopi yang baik.<br>Ruang yang berarti.</h3>
            <p style="font-size: 12px; color: #D1D1D6;">Temukan sudut favoritmu di Nako Solo.</p>
        </div>

        <button class="btn-primary" onclick="navigateTo('screen-table')">
            <span>Pesan Tanpa Antre & Cek Meja</span>
            <span style="font-size: 18px;">→</span>
        </button>
    </div>

    <!-- SCREEN 2: INTERACTIVE LIVE TABLE FLOOR PLAN -->
    <div id="screen-table" class="app-content hidden">
        <h2>Peta Meja Real-time</h2>
        <p style="color: var(--neon-green); font-size: 13px; font-weight: 600; margin-bottom: 16px;">🟢 3 dari 6 meja tersedia</p>
        
        <!-- Legend Indicator -->
        <div style="display: flex; gap: 14px; font-size: 11px; color: var(--text-muted); background: var(--surface-color); padding: 10px; border-radius: 10px; margin-bottom: 16px; border:1px solid #2A2A2A;">
            <div><span class="status-dot" style="background: var(--neon-green)"></span>Tersedia</div>
